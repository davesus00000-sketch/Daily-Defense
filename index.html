    <!-- PWA & Mobile Web Standards -->
    <meta name="theme-color" content="#1e3a8a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Gracefully prevent unhandled WebSocket closure notices from halting app execution
      window.addEventListener('error', function(e) {
        if (e.message && (e.message.includes('WebSocket') || e.message.includes('ws') || e.message.includes('opened'))) {
          e.stopImmediatePropagation();
          e.preventDefault();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        var msg = String(e.reason && (e.reason.message || e.reason) || '');
        if (msg.includes('WebSocket') || msg.includes('opened')) {
          e.preventDefault();
        }
      });
      // Filter out [vite] WebSocket closed logs from console.error
      var _origErr = console.error;
      console.error = function() {
        var joined = Array.prototype.slice.call(arguments).map(function(a) {
          return String(a && a.message ? a.message : a);
        }).join(' ');
        if (joined.includes('WebSocket') || joined.includes('server connection lost')) {
          return;
        }
        _origErr.apply(console, arguments);
      };
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
